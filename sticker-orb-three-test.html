<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ヨロズモン｜玉3位置合わせ v1</title><style>body{margin:0;padding:12px;background:#101827;color:#f7f4e9;font:14px system-ui}.wrap{max-width:800px;margin:auto}h1{font-size:20px}p{line-height:1.5}.preview{position:relative;width:min(100%,650px);aspect-ratio:1;margin:12px auto;background:#06080d;border:1px solid #9b8556;touch-action:none}.preview img,.preview svg{position:absolute;inset:0;width:100%;height:100%}.preview img{object-fit:fill;pointer-events:none}.preview svg{touch-action:none}.preview circle,.preview text{cursor:grab;touch-action:none}.preview .active{filter:drop-shadow(0 0 10px #fff)}button{background:#91621e;color:#fff;border:1px solid #d6ad60;border-radius:8px;padding:10px;margin:4px;cursor:pointer}input[type=file]{max-width:100%}.status{color:#f9d589}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:440px;margin:12px auto}.grid button{margin:0}.grid button.active{outline:3px solid #6cffb2}.tools{text-align:center}.readout{font-variant-numeric:tabular-nums;color:#d5e1f5}textarea{width:100%;height:100px;box-sizing:border-box;background:#18243b;color:#fff}small{color:#aebfd1}</style></head><body><main class="wrap"><h1>🦖 玉「3」専用・位置合わせ v1</h1><p>全8方向に赤玉を3個ずつ、ハートに「2」を表示。3個とも独立してドラッグできます。下の①②③ボタンで選んで矢印で微調整できます。玉1・2の確定座標には影響しません。<strong>玉や数字をドラッグして位置調整</strong>できます。矢印ボタンで1pxずつ微調整も可能。</p><input id="file" type="file" accept="image/*"><div class="preview" id="preview"><img id="base" alt="完成版の空欄UIを選択"><svg id="svg" viewBox="0 0 1248 1248" aria-label="玉の位置調整"></svg></div><div class="grid" id="pick"></div><div class="tools"><button id="left">← 1px</button><button id="up">↑ 1px</button><button id="down">↓ 1px</button><button id="right">→ 1px</button><button id="reset">初期位置に戻す</button></div><p id="readout" class="readout"></p><div class="tools"><button id="copy">📋 確定座標をコピー</button><button id="export">💾 座標JSONを保存</button></div><textarea id="coords" readonly></textarea><p class="status" id="status">画像を読み込んで、各玉の中心を合わせてください。</p><small>このページは位置合わせ専用。対戦ゲーム本体には影響しません。調整座標はこのブラウザ内に自動保存されます。完成したら座標をコピーしてチャットに送ってください。1個目の確定座標は固定されています。</small></main><script>
const KEY='yorozu-orb-three-v1';const labels=["↖ 左上 ①","↖ 左上 ②","↖ 左上 ③","↑ 上 ①","↑ 上 ②","↑ 上 ③","↗ 右上 ①","↗ 右上 ②","↗ 右上 ③","→ 右 ①","→ 右 ②","→ 右 ③","↘ 右下 ①","↘ 右下 ②","↘ 右下 ③","↓ 下 ①","↓ 下 ②","↓ 下 ③","↙ 左下 ①","↙ 左下 ②","↙ 左下 ③","← 左 ①","← 左 ②","← 左 ③","♥ HP"];const defaults=[{"x":52,"y":136},{"x":95,"y":93},{"x":138,"y":50},{"x":581,"y":78},{"x":624,"y":78},{"x":667,"y":78},{"x":1201,"y":138},{"x":1158,"y":95},{"x":1115,"y":52},{"x":1170,"y":581},{"x":1170,"y":624},{"x":1170,"y":667},{"x":1198,"y":1200},{"x":1155,"y":1157},{"x":1112,"y":1114},{"x":581,"y":1170},{"x":624,"y":1170},{"x":667,"y":1170},{"x":135,"y":1197},{"x":92,"y":1154},{"x":49,"y":1111},{"x":78,"y":581},{"x":78,"y":624},{"x":78,"y":667},{"x":1029,"y":1028}];let points;try{const saved=JSON.parse(localStorage.getItem(KEY));points=Array.isArray(saved)&&saved.length===25&&saved.every(p=>Number.isFinite(p.x)&&Number.isFinite(p.y))?saved:structuredClone(defaults)}catch(e){points=defaults.map(p=>({...p}))}let selected=0,dragging=false;const svg=document.getElementById('svg'),pick=document.getElementById('pick');const NS='http://www.w3.org/2000/svg';function node(t,a){const e=document.createElementNS(NS,t);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));return e}function draw(){svg.replaceChildren();points.forEach((p,i)=>{const g=node('g',{'data-i':i,class:i===selected?'active':''});if(i===24){const t=node('text',{x:p.x,y:p.y,'text-anchor':'middle','dominant-baseline':'central','font-size':94,'font-weight':1000,'font-family':'Arial,sans-serif',fill:'#fff',stroke:'#121018','stroke-width':12,'paint-order':'stroke'});t.textContent='3';g.append(t);g.append(node('rect',{x:p.x-55,y:p.y-65,width:110,height:130,fill:'transparent'}))}else{g.append(node('circle',{cx:p.x,cy:p.y,r:29,fill:'#0b1120',stroke:'#f8d56d','stroke-width':5}));g.append(node('circle',{cx:p.x,cy:p.y,r:24,fill:'#ee3942',stroke:'#ffffff9c','stroke-width':2}));g.append(node('ellipse',{cx:p.x-7,cy:p.y-9,rx:8,ry:6,fill:'#ffffffb8'}))}svg.append(g)});document.getElementById('readout').textContent=labels[selected]+'：x='+points[selected].x+', y='+points[selected].y;document.getElementById('coords').value=JSON.stringify(Object.fromEntries(labels.map((v,i)=>[v,{x:points[i].x,y:points[i].y}])),null,2);localStorage.setItem(KEY,JSON.stringify(points))}function renderPick(){pick.replaceChildren();labels.forEach((v,i)=>{const b=document.createElement('button');b.textContent=v;b.className=i===selected?'active':'';b.onclick=()=>{selected=i;renderPick();draw()};pick.append(b)});draw()}function move(e){const r=svg.getBoundingClientRect();points[selected]={x:Math.round((e.clientX-r.left)*1248/r.width),y:Math.round((e.clientY-r.top)*1248/r.height)};draw()}svg.addEventListener('pointerdown',e=>{const r=svg.getBoundingClientRect();const x=(e.clientX-r.left)*1248/r.width,y=(e.clientY-r.top)*1248/r.height;let nearest=-1,dist=Infinity;points.forEach((p,i)=>{const d=Math.hypot(p.x-x,p.y-y);if(d<dist){dist=d;nearest=i}});if(dist>75)return;selected=nearest;dragging=true;svg.setPointerCapture(e.pointerId);move(e);renderPick()});svg.addEventListener('pointermove',e=>{if(dragging)move(e)});svg.addEventListener('pointerup',()=>dragging=false);svg.addEventListener('pointercancel',()=>dragging=false);for(const [id,dx,dy] of [['left',-1,0],['right',1,0],['up',0,-1],['down',0,1]])document.getElementById(id).onclick=()=>{points[selected].x+=dx;points[selected].y+=dy;draw()};document.getElementById('reset').onclick=()=>{if(confirm('すべての位置を初期値に戻しますか？')){points=defaults.map(p=>({...p}));renderPick()}};document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const img=document.getElementById('base');if(img.dataset.url)URL.revokeObjectURL(img.dataset.url);img.dataset.url=URL.createObjectURL(f);img.src=img.dataset.url};document.getElementById('copy').onclick=()=>{const v=document.getElementById('coords').value;navigator.clipboard.writeText(v).then(()=>document.getElementById('status').textContent='座標をコピーしました。チャットに貼ってください。').catch(()=>{document.getElementById('coords').select();document.getElementById('status').textContent='テキスト欄を選択しました。手動でコピーしてください。'})};document.getElementById('export').onclick=()=>{const blob=new Blob([document.getElementById('coords').value],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tyrannokaiser-orb-three-coordinates.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};renderPick();
</script></body></html>
