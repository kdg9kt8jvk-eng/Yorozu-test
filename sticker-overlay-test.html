<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ティラノカイザー 動的ステータス試作 v3</title><style>body{margin:0;background:#101827;color:#fff;font:15px system-ui;padding:14px}main{max-width:760px;margin:auto}h1{font-size:21px}.preview{position:relative;width:min(100%,620px);aspect-ratio:1;background:#090909;margin:12px auto;border:1px solid #a78a43}.preview img,.preview svg{position:absolute;inset:0;width:100%;height:100%}.preview img{object-fit:contain}.preview svg{pointer-events:none}fieldset{border:1px solid #596375;border-radius:10px;margin:10px 0}label{display:inline-flex;gap:7px;align-items:center;margin:5px 10px 5px 0}input[type=number]{width:55px;padding:5px;background:#26354a;color:#fff;border:1px solid #889}button{padding:9px 14px;background:#a4772b;color:#fff;border:0;border-radius:8px}small{color:#b9c5d4}#status{color:#f6d48a}</style></head><body><main><h1>🦖 ティラノカイザー｜動的な玉・HP表示テスト</h1><p>新しい完全版の空欄UI画像を選ぶと、画像を描き直さずに8方向の玉とHPを重ねます。画像は端末内だけで使用します。</p><input id="file" type="file" accept="image/*"><div class="preview"><img id="base" alt="空欄UIの画像を選択してください"><svg id="overlay" viewBox="0 0 1248 1248" aria-label="能力値オーバーレイ"></svg></div><fieldset><legend>方向値（↖ ↑ ↗ → ↘ ↓ ↙ ←）</legend><div id="controls"></div></fieldset><label>HP <input id="hp" type="number" min="0" max="99" value="5"></label><button id="level">🪙 コイン獲得（0以外＋1、HP＋1）</button><button id="reset">初期値に戻す</button><p id="status">空欄UIを読み込んでください</p><small>試作専用ページ。既存の対戦画面・ゲームデータには影響しません。方向値の初期設定はYM001の登録値です。</small></main><script>const initial=[2,2,2,1,1,1,1,1],names=['↖','↑','↗','→','↘','↓','↙','←'];let values=[...initial];const svg=document.getElementById('overlay'),controls=document.getElementById('controls');const NS='http://www.w3.org/2000/svg';const slots=[{x:105,y:105,axis:'corner',sx:1,sy:1},{x:624,y:80,axis:'h'},{x:1143,y:105,axis:'corner',sx:-1,sy:1},{x:1170,y:624,axis:'v'},{x:1143,y:1143,axis:'corner',sx:-1,sy:-1},{x:624,y:1167,axis:'h'},{x:105,y:1143,axis:'corner',sx:1,sy:-1},{x:78,y:624,axis:'v'}];function el(tag,attrs){const n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);return n}function draw(){svg.replaceChildren();values.forEach((count,i)=>{const slot=slots[i];if(!count)return;const n=Math.min(9,count);let centers=[];const step=70;if(slot.axis==='h')centers=Array.from({length:n},(_,j)=>[slot.x+(j-(n-1)/2)*step,slot.y]);else if(slot.axis==='v')centers=Array.from({length:n},(_,j)=>[slot.x,slot.y+(j-(n-1)/2)*step]);else{const cornerPattern=[[0,0],[-.48,-.48],[.48,-.48],[-.48,.48],[.48,.48],[-.95,-.95],[.95,-.95],[-.95,.95],[.95,.95]];if(n===1)centers=[[slot.x,slot.y]];else if(n===2)centers=[[-.5,-.5],[.5,.5]].map(([a,b])=>[slot.x+slot.sx*a*70,slot.y+slot.sy*b*70]);else centers=cornerPattern.slice(0,n).map(([a,b])=>[slot.x+slot.sx*a*70,slot.y+slot.sy*b*70])}const color=count===1?'#15c870':count===2?'#168aff':'#ff303a';centers.forEach(([x,y])=>{svg.append(el('circle',{cx:x,cy:y,r:29,fill:'#070b16',stroke:'#f8d56d','stroke-width':5}));svg.append(el('circle',{cx:x,cy:y,r:24,fill:color,stroke:'#fff8','stroke-width':2}));svg.append(el('ellipse',{cx:x-7,cy:y-9,rx:8,ry:6,fill:'#ffffffbd'}))})});const hp=Number(document.getElementById('hp').value)||0;const t=el('text',{x:1030,y:1014,'text-anchor':'middle','dominant-baseline':'middle','font-size':91,'font-weight':1000,fill:'white',stroke:'#111','stroke-width':11,'paint-order':'stroke','font-family':'Arial,sans-serif'});t.textContent=hp;svg.append(t);document.getElementById('status').textContent='方向値 '+values.join(' / ')+' ｜ HP '+hp}function inputs(){controls.replaceChildren();values.forEach((v,i)=>{const l=document.createElement('label');l.textContent=names[i]+' ';const n=document.createElement('input');n.type='number';n.min=0;n.max=9;n.value=v;n.oninput=()=>{values[i]=Math.max(0,Math.min(9,Number(n.value)||0));draw()};l.append(n);controls.append(l)})}document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(f){const img=document.getElementById('base');if(img.dataset.url)URL.revokeObjectURL(img.dataset.url);img.dataset.url=URL.createObjectURL(f);img.src=img.dataset.url}};document.getElementById('hp').oninput=draw;document.getElementById('level').onclick=()=>{values=values.map(v=>v?v+1:0);document.getElementById('hp').value=Number(document.getElementById('hp').value)+1;inputs();draw()};document.getElementById('reset').onclick=()=>{values=[...initial];document.getElementById('hp').value=5;inputs();draw()};inputs();draw();</script></body></html>
