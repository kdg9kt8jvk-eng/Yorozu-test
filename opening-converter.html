<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ヨロズモン・透過キャラ一括変換</title>
<style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;background:#101827;color:#f8f3e7}*{box-sizing:border-box}body{margin:0;padding:20px}main{max-width:880px;margin:auto}h1{font-size:clamp(23px,5vw,36px);color:#ffd57a}p{line-height:1.7}.box{background:#202b40;border:1px solid #506078;border-radius:15px;padding:20px;margin:15px 0}label{display:block;margin:10px 0;font-weight:700}input[type=file]{max-width:100%;padding:14px;border:2px dashed #a58a56;border-radius:10px}button{background:#bd8129;color:#fff;border:1px solid #ffd47d;border-radius:10px;padding:13px 22px;font-size:16px;font-weight:800;cursor:pointer}button:disabled{opacity:.45}input[type=number]{width:85px;padding:7px;border-radius:6px}progress{width:100%;height:20px}small{color:#c5d2e3}#log{white-space:pre-wrap;max-height:240px;overflow:auto;font-size:13px}#preview{display:flex;flex-wrap:wrap;gap:10px}#preview img{width:110px;height:110px;object-fit:contain;background:#333}a{color:#ffd57a}
</style></head><body><main>
<h1>🦖 ヨロズモン・透過キャラ一括変換</h1>
<p>オープニング専用。<b>背景透過を維持</b>した軽量WebPを一括生成。ブラウザ内で処理するため、画像は外部サーバーに送信されません。</p>
<div class="box"><label>① 背景透過PNGをまとめて選択</label><input id="files" type="file" accept="image/png" multiple>
<p id="count">未選択</p><div id="preview"></div></div>
<div class="box"><h2>② 出力設定</h2>
<label>最大画像サイズ：<input id="largeSize" type="number" min="128" max="2048" value="768"> px ／ 目標容量：<input id="largeKB" type="number" min="20" max="1500" value="200"> KB 以下</label><small>縦横比を維持し、透明キャンバス中央に配置。PNGの透明部分を保持します。容量目標を超える場合は画質と解像度を自動調整。ブラウザがWebP出力に対応していない場合はエラーにします。</small><p><button id="go">③ 一括変換してZIPを保存</button></p><progress id="progress" value="0" max="100"></progress><p id="status">待機中</p></div>
<div class="box"><h2>変換結果</h2><div id="log">ここに処理結果が表示されます。</div></div>
<p><a href="./">← ヨロズモン大戦へ戻る</a></p>
</main><script>
const $=id=>document.getElementById(id),files=$('files'),go=$('go'),log=$('log'),status=$('status'),progress=$('progress');
files.addEventListener('change',()=>{$('count').textContent=files.files.length+'枚選択';const p=$('preview');p.replaceChildren();[...files.files].slice(0,8).forEach(f=>{const im=new Image();const u=URL.createObjectURL(f);im.onload=()=>URL.revokeObjectURL(u);im.src=u;p.append(im)})});
function crc32(bytes){let c=0xffffffff;for(const b of bytes){c^=b;for(let j=0;j<8;j++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^0xffffffff)>>>0}
const encoder=new TextEncoder();
function zipStore(entries){const chunks=[],central=[];let offset=0;const u16=(v)=>[v&255,(v>>>8)&255],u32=(v)=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];for(const e of entries){const name=encoder.encode(e.name),data=e.data,crc=crc32(data),size=data.length;const local=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(size),...u32(size),...u16(name.length),...u16(0)]);chunks.push(local,name,data);const header=new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(size),...u32(size),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset)]);central.push(header,name);offset+=local.length+name.length+size}const centralSize=central.reduce((n,c)=>n+c.length,0);chunks.push(...central,new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(entries.length),...u16(entries.length),...u32(centralSize),...u32(offset),...u16(0)]));return new Blob(chunks,{type:'application/zip'})}
async function encode(canvas,limit){let best=null;for(const quality of [.85,.7,.55,.4,.25,.12,.05]){const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',quality));if(!blob||blob.type!=='image/webp')throw Error('このブラウザではWebP書き出しができません。ChromeまたはEdgeでお試しください（PNGへの自動変換は防止しました）');if(!best||blob.size<best.size)best=blob;if(blob.size<=limit*1024)return blob}return best}
async function processImage(file,size,kb){const bitmap=await createImageBitmap(file);try{const maxSide=Math.max(bitmap.width,bitmap.height);if(file.type==='image/webp'&&maxSide<=size&&file.size<=kb*1024)return file;let edge=Math.min(size,maxSide),best=null;for(let attempt=0;attempt<6;attempt++){const canvas=document.createElement('canvas');canvas.width=canvas.height=Math.max(64,Math.round(edge));const ctx=canvas.getContext('2d');const ratio=Math.min(canvas.width/bitmap.width,canvas.height/bitmap.height,1);const w=bitmap.width*ratio,h=bitmap.height*ratio;ctx.drawImage(bitmap,(canvas.width-w)/2,(canvas.height-h)/2,w,h);const blob=await encode(canvas,kb);if(!best||blob.size<best.size)best=blob;if(blob.size<=kb*1024)break;edge=Math.max(64,edge*.75)}if(file.type==='image/webp'&&file.size<best.size&&maxSide<=size)return file;return best}finally{bitmap.close()}}
go.addEventListener('click',async()=>{const list=[...files.files].filter(f=>f.type==='image/png');if(!list.length){alert('透過PNGを選んでください');return}const ls=+$('largeSize').value,lk=+$('largeKB').value;if(!Number.isFinite(ls)||!Number.isFinite(lk)||ls<128||lk<20){alert('設定値を確認してください');return}go.disabled=true;log.textContent='';progress.value=0;const entries=[],used=new Set();let totalBefore=0,totalAfter=0,failed=0;try{for(let i=0;i<list.length;i++){const file=list[i];status.textContent=(i+1)+' / '+list.length+'：'+file.name;try{const base=file.name.replace(/\\.[^.]+$/,'').replace(/[^a-zA-Z0-9_\\-\\u3040-\\u30ff\\u3400-\\u9fff]/g,'_')||'character';let name=base,n=2;while(used.has(name.toLowerCase()))name=base+'_'+n++;used.add(name.toLowerCase());const large=await processImage(file,ls,lk);entries.push({name:'opening-characters/'+name+'.webp',data:new Uint8Array(await large.arrayBuffer())});totalBefore+=file.size;totalAfter+=large.size;log.textContent+=name+'：'+Math.round(file.size/1024)+'KB → '+Math.round(large.size/1024)+'KB'+(large.size>lk*1024?' ⚠️目標容量超過':'')+'\\n'}catch(err){failed++;log.textContent+='❌ '+file.name+'：'+err.message+'\\n'}progress.value=(i+1)/list.length*100;await new Promise(r=>setTimeout(r,0))}if(!entries.length)throw Error('変換に成功した画像がありません');status.textContent='ZIP作成中…';const blob=zipStore(entries),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='yorozumon-opening-'+new Date().toISOString().slice(0,10)+'.zip';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);status.textContent='完了！ '+entries.length+'枚変換、失敗 '+failed+'枚。変換前 '+(totalBefore/1048576).toFixed(1)+'MB → 出力合計 '+(totalAfter/1048576).toFixed(1)+'MB';}catch(e){status.textContent='エラー：'+e.message}finally{go.disabled=false}});
</script></body></html>
