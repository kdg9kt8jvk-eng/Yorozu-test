<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ヨロズモン画像一括変換</title>
<style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;background:#101827;color:#f8f3e7}*{box-sizing:border-box}body{margin:0;padding:20px}main{max-width:880px;margin:auto}h1{font-size:clamp(23px,5vw,36px);color:#ffd57a}p{line-height:1.7}.box{background:#202b40;border:1px solid #506078;border-radius:15px;padding:20px;margin:15px 0}label{display:block;margin:10px 0;font-weight:700}input[type=file]{max-width:100%;padding:14px;border:2px dashed #a58a56;border-radius:10px}button{background:#bd8129;color:#fff;border:1px solid #ffd47d;border-radius:10px;padding:13px 22px;font-size:16px;font-weight:800;cursor:pointer}button:disabled{opacity:.45}input[type=number]{width:85px;padding:7px;border-radius:6px}progress{width:100%;height:20px}small{color:#c5d2e3}#log{white-space:pre-wrap;max-height:240px;overflow:auto;font-size:13px}#preview{display:flex;flex-wrap:wrap;gap:10px}#preview img{width:110px;height:110px;object-fit:contain;background:#333}a{color:#ffd57a}
</style></head><body><main>
<h1>🦖 ヨロズモン画像一括変換</h1>
<p>シール画像をまとめて選ぶだけで、<b>キャラ選択用の軽量画像</b>と<b>対戦・詳細用画像</b>を同時生成。ブラウザ内で処理するため、画像は外部サーバーに送信されません。</p>
<div class="box"><label>① 画像をまとめて選択（PNG / JPEG / WebP）</label><input id="files" type="file" accept="image/png,image/jpeg,image/webp" multiple>
<p id="count">未選択</p><div id="preview"></div></div>
<div class="box"><h2>② 出力設定</h2>
<label>選択画面用：<input id="thumbSize" type="number" min="64" max="2048" value="256"> px ／ 目標 <input id="thumbKB" type="number" min="5" max="1000" value="40"> KB 以下</label>
<label>対戦・詳細用：<input id="largeSize" type="number" min="128" max="4096" value="768"> px ／ 目標 <input id="largeKB" type="number" min="10" max="5000" value="200"> KB 以下</label>
<small>縦横比を維持し、正方形の透明キャンバス中央に配置。目標容量を達成できない場合は最も低い設定で書き出し、ログに記録します。透過はWebPで保持します。</small>
<p><button id="go">③ 一括変換してZIPを保存</button></p><progress id="progress" value="0" max="100"></progress><p id="status">待機中</p></div>
<div class="box"><h2>変換結果</h2><div id="log">ここに処理結果が表示されます。</div></div>
<p><a href="./">← ヨロズモン大戦へ戻る</a></p>
</main><script>
const $=id=>document.getElementById(id),files=$('files'),go=$('go'),log=$('log'),status=$('status'),progress=$('progress');
files.addEventListener('change',()=>{$('count').textContent=files.files.length+'枚選択';const p=$('preview');p.replaceChildren();[...files.files].slice(0,8).forEach(f=>{const im=new Image();const u=URL.createObjectURL(f);im.onload=()=>URL.revokeObjectURL(u);im.src=u;p.append(im)})});
function crc32(bytes){let c=0xffffffff;for(const b of bytes){c^=b;for(let j=0;j<8;j++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^0xffffffff)>>>0}
const encoder=new TextEncoder();
function zipStore(entries){const chunks=[],central=[];let offset=0;const u16=(v)=>[v&255,(v>>>8)&255],u32=(v)=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];for(const e of entries){const name=encoder.encode(e.name),data=e.data,crc=crc32(data),size=data.length;const local=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(size),...u32(size),...u16(name.length),...u16(0)]);chunks.push(local,name,data);const header=new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x800),...u16(0),...u16(0),...u16(0),...u32(crc),...u32(size),...u32(size),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset)]);central.push(header,name);offset+=local.length+name.length+size}const centralSize=central.reduce((n,c)=>n+c.length,0);chunks.push(...central,new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(entries.length),...u16(entries.length),...u32(centralSize),...u32(offset),...u16(0)]));return new Blob(chunks,{type:'application/zip'})}
async function encode(canvas,limit){let best=null;for(const quality of [.9,.8,.7,.6,.5,.4,.3,.2,.1]){const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',quality));if(!blob)throw Error('WebP出力に失敗しました');best=blob;if(blob.size<=limit*1024)break}return best}
async function processImage(file,size,kb){const bitmap=await createImageBitmap(file);try{const canvas=document.createElement('canvas');canvas.width=canvas.height=size;const ctx=canvas.getContext('2d');const ratio=Math.min(size/bitmap.width,size/bitmap.height);const w=bitmap.width*ratio,h=bitmap.height*ratio;ctx.drawImage(bitmap,(size-w)/2,(size-h)/2,w,h);return await encode(canvas,kb)}finally{bitmap.close()}}
go.addEventListener('click',async()=>{const list=[...files.files].filter(f=>/^image\/(png|jpeg|webp)$/.test(f.type));if(!list.length){alert('画像を選んでください');return}const ts=+$('thumbSize').value,ls=+$('largeSize').value,tk=+$('thumbKB').value,lk=+$('largeKB').value;if(![ts,ls,tk,lk].every(Number.isFinite)||ts<64||ls<128||tk<5||lk<10){alert('設定値を確認してください');return}if(list.length>65535){alert('一度に処理できるのは65535枚までです');return}go.disabled=true;log.textContent='';progress.value=0;const entries=[],used=new Set();let totalBefore=0,totalAfter=0,failed=0;try{for(let i=0;i<list.length;i++){const file=list[i];status.textContent=(i+1)+' / '+list.length+'：'+file.name;try{const base=file.name.replace(/\.[^.]+$/,'').replace(/[^a-zA-Z0-9_\-\u3040-\u30ff\u3400-\u9fff]/g,'_')||'image';let name=base,n=2;while(used.has(name.toLowerCase()))name=base+'_'+n++;used.add(name.toLowerCase());const thumb=await processImage(file,ts,tk),large=await processImage(file,ls,lk);entries.push({name:'thumbnails/'+name+'.webp',data:new Uint8Array(await thumb.arrayBuffer())},{name:'characters/'+name+'.webp',data:new Uint8Array(await large.arrayBuffer())});totalBefore+=file.size;totalAfter+=thumb.size+large.size;log.textContent+=name+'：選択用 '+Math.round(thumb.size/1024)+'KB／対戦用 '+Math.round(large.size/1024)+'KB'+(thumb.size>tk*1024||large.size>lk*1024?' ⚠️目標容量超過':'')+'\n'}catch(err){failed++;log.textContent+='❌ '+file.name+'：'+err.message+'\n'}progress.value=(i+1)/list.length*100;await new Promise(r=>setTimeout(r,0))}if(!entries.length)throw Error('変換に成功した画像がありません');status.textContent='ZIP作成中…';const blob=zipStore(entries),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='yorozumon-images-'+new Date().toISOString().slice(0,10)+'.zip';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);status.textContent='完了！ '+entries.length/2+'枚変換、失敗 '+failed+'枚。変換前 '+(totalBefore/1048576).toFixed(1)+'MB → 出力合計 '+(totalAfter/1048576).toFixed(1)+'MB';}catch(e){status.textContent='エラー：'+e.message}finally{go.disabled=false}});
</script></body></html>
