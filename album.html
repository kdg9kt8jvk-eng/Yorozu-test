<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>万物アルバム｜ヨロズモン大戦</title><style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;background:#111723;color:#fff2d6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#44331d,#111723 65%);min-height:100vh}.wrap{max-width:1060px;margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.back{color:#ffe0a0;text-decoration:none;border:1px solid #a47a36;border-radius:9px;padding:10px 14px}h1{font-size:clamp(26px,5vw,45px);color:#ffce65;text-shadow:0 3px #482a08;margin:15px 0 2px}.sub{font-size:12px;letter-spacing:3px;color:#e7bb6a}.panel{background:linear-gradient(135deg,#352b23,#171e2b);border:2px solid #967037;border-radius:16px;box-shadow:0 9px 26px #0007;padding:16px;margin-top:15px}.bar{height:10px;background:#111a27;border-radius:9px;overflow:hidden;margin-top:7px}.fill{height:100%;width:100%;background:linear-gradient(90deg,#bd7c1c,#ffe47a)}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.filters button,.tabs button{border:1px solid #816237;background:#202938;color:#f6e9d2;padding:10px 12px;border-radius:9px;font-weight:700;cursor:pointer}.filters button.active,.tabs button.active{background:linear-gradient(#f5c75d,#b87921);color:#23170b}.search{background:#121c2b;color:white;border:1px solid #816237;border-radius:9px;padding:10px;min-width:150px;flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:13px}.sticker{padding:5px;background:#1d2633;border:2px solid #85622c;border-radius:10px;cursor:pointer;color:#fff;min-width:0;text-align:left}.sticker:hover,.sticker:focus-visible{border-color:#ffe286;transform:translateY(-2px)}.sticker img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:5px;background:#34363b}.sticker strong{font-size:11px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:5px 2px 2px}.sticker small{font-size:10px;color:#dfb976}.empty{color:#cbbca3;padding:24px}.modal{position:fixed;inset:0;background:#000b;display:none;z-index:20;overflow:auto;padding:18px}.modal.open{display:flex;align-items:flex-start;justify-content:center}.detail{width:min(850px,100%);margin:auto;background:linear-gradient(145deg,#3d3022,#172333 55%,#1c2632);border:3px solid #b78a3c;border-radius:16px;padding:18px;box-shadow:0 20px 60px #000a}.detailHead{display:flex;justify-content:space-between;align-items:start;gap:8px}.close{font-size:25px;border:1px solid #c49b4b;background:#3b2330;color:#fff;border-radius:9px;cursor:pointer;padding:5px 12px}.detailGrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:12px}.hero{width:100%;aspect-ratio:1;object-fit:contain;background:#1b2029;border:2px solid #d2a749;border-radius:10px}.stats{background:#131e2d;border:1px solid #7c6038;border-radius:12px;padding:15px}.stats p{margin:8px 0}.dirs{display:grid;grid-template-columns:repeat(3,52px);gap:6px;justify-content:center;margin-top:13px}.dirs span{height:47px;border-radius:50%;display:grid;place-items:center;background:#8c2532;border:2px solid #df7c75;font-weight:900;font-size:19px}.dirs span:nth-child(2),.dirs span:nth-child(8){background:#1e669e;border-color:#83c9ff}.dirs span:nth-child(4),.dirs span:nth-child(6){background:#276c3c;border-color:#89c993}.dirs span:nth-child(5){background:transparent;border:0}.tabs{display:flex;gap:8px;margin-top:15px}.story{min-height:110px;background:#e7d1a1;color:#3b2814;border-radius:10px;padding:18px;line-height:1.8;margin-top:10px}.related{display:flex;gap:8px;overflow:auto;margin-top:10px}.related button{min-width:90px;max-width:100px;background:#1b2737;border:1px solid #95723c;color:white;border-radius:8px;padding:5px;cursor:pointer}.related img{width:100%;aspect-ratio:1;object-fit:cover}.related small{font-size:10px;display:block}.note{color:#d2bb8c;font-size:12px;line-height:1.6}@media(max-width:580px){.detailGrid{grid-template-columns:1fr}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.sticker strong{font-size:10px}.wrap{padding:10px}.detail{padding:11px}.dirs{grid-template-columns:repeat(3,47px)}}
</style></head><body><div class="wrap"><img src="./images/yorozu-logo.png" alt="万物大戦 ヨロズモン グレイトバトル" style="display:block;width:100%;max-width:720px;height:auto;max-height:190px;object-fit:contain;margin:0 auto 12px" onerror="this.style.display='none'"><div class="top"><div><div class="sub">YOROZUMON COLLECTION</div><h1>万物アルバム</h1></div><a class="back" href="./index.html">← バトルに戻る</a></div><section class="panel"><strong id="count">収録シールを読み込み中…</strong><div class="bar"><div class="fill"></div></div><p class="note">第1段階：登録済みの全シールを閲覧できるプレビュー版です。所持・未所持、獲得演出、収集率は今後の収集モード実装時に連動します。</p><div class="filters" id="roles"></div><div class="filters"><select id="attribute" class="search" aria-label="属性で絞り込み"><option value="">すべての属性</option></select><input id="search" class="search" placeholder="名前・番号で検索" aria-label="シール検索"></div><div id="grid" class="grid"></div></section></div><div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="キャラクター詳細"><div class="detail"><div class="detailHead"><div><div id="number" class="sub"></div><h1 id="name" style="font-size:clamp(20px,4vw,31px)"></h1></div><button id="close" class="close" aria-label="閉じる">×</button></div><div class="detailGrid"><img id="hero" class="hero" alt=""><div class="stats"><p id="meta"></p><p id="hp"></p><strong>8方向の数値</strong><div id="dirs" class="dirs"></div></div></div><div class="tabs"><button id="profileTab" class="active">プロフィール</button><button id="storyTab">バックストーリー</button></div><div id="story" class="story"></div><h3>関連キャラクター</h3><div id="related" class="related"></div><p class="note">※プロフィール・物語は正式な設定原稿を順次登録予定です。未確定のストーリーを創作して表示することはありません。</p></div></div><script src="./roster.js"></script><script>
(()=>{'use strict';const roster=(window.YOROZUMON_ROSTER||[]).filter(c=>/^YM\d{3}$/.test(c.id));const $=id=>document.getElementById(id);let role='',current=null,tab='profile';const image=(id,large=false)=>(large?'./characters/':'./images/thumbnails/')+id+'.webp';const fallback=id=>'./images/'+id+'.webp';const roles=['すべて','キング','ヒーロー','敵キャラ','お助け'];const bio=window.YOROZUMON_LORE||{};function img(el,id,large=false){el.src=image(id,large);el.onerror=()=>{el.onerror=null;el.src=fallback(id)}}function build(){ $('count').textContent='登録済みシール：'+roster.length+'体';const attrs=[...new Set(roster.map(c=>c.attribute))].sort((a,b)=>a.localeCompare(b,'ja'));for(const a of attrs){const o=document.createElement('option');o.value=a;o.textContent=a;$('attribute').append(o)}for(const r of roles){const b=document.createElement('button');b.textContent=r;b.className=r==='すべて'?'active':'';b.onclick=()=>{role=r==='すべて'?'':r;for(const x of $('roles').children)x.classList.toggle('active',x===b);render()};$('roles').append(b)}render()}function render(){const q=$('search').value.trim().toLowerCase(),a=$('attribute').value;const list=roster.filter(c=>(!role||c.role===role)&&(!a||c.attribute===a)&&(!q||c.name.toLowerCase().includes(q)||c.id.toLowerCase().includes(q)));$('grid').replaceChildren();for(const c of list){const b=document.createElement('button');b.className='sticker';const im=document.createElement('img');im.loading='lazy';img(im,c.id);const name=document.createElement('strong');name.textContent=c.name;const sm=document.createElement('small');sm.textContent=c.id+' · '+c.role;b.append(im,name,sm);b.onclick=()=>open(c);$('grid').append(b)}if(!list.length){const p=document.createElement('p');p.className='empty';p.textContent='該当するシールはありません';$('grid').append(p)}}function content(){const data=bio[current.id]||{};if(tab==='story')$('story').textContent=data.story||'バックストーリーは現在制作中。正式設定の公開をお待ちください。';else $('story').textContent=data.profile||'このキャラクターの紹介文は現在準備中。今後、性格・生い立ち・目的などを公開します。';$('profileTab').classList.toggle('active',tab==='profile');$('storyTab').classList.toggle('active',tab==='story')}function open(c){current=c;tab='profile';$('number').textContent=c.id+' / '+c.role;$('name').textContent=c.name;img($('hero'),c.id,true);$('hero').alt=c.name;$('meta').textContent='属性：'+c.attribute+'　｜　役割：'+c.role;$('hp').textContent='❤ HP：'+c.hp;$('dirs').replaceChildren();for(let i=0;i<9;i++){const v=document.createElement('span');v.textContent=i===4?'＋':String(c.d[i<4?i:i-1]??0);$('dirs').append(v)}$('related').replaceChildren();for(const r of roster.filter(x=>x.attribute===c.attribute&&x.id!==c.id)){const b=document.createElement('button'),im=document.createElement('img'),sm=document.createElement('small');img(im,r.id);sm.textContent=r.name;b.append(im,sm);b.onclick=()=>open(r);$('related').append(b)}content();$('modal').classList.add('open');document.body.style.overflow='hidden'}function close(){$('modal').classList.remove('open');document.body.style.overflow=''}$('close').onclick=close;$('modal').onclick=e=>{if(e.target===$('modal'))close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});$('profileTab').onclick=()=>{tab='profile';content()};$('storyTab').onclick=()=>{tab='story';content()};$('search').oninput=render;$('attribute').onchange=render;build()})();
</script></body></html>
